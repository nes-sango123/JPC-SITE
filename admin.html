<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration | JPC-SITE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #14532d;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #166534;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #166534;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="login-box">
        <h1>JPC-SITE</h1>

        <p class="subtitle">
            Espace d'administration
        </p>

        <form id="login-form">
            <label for="email">Adresse e-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Votre adresse e-mail"
                autocomplete="username"
                required
            >

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="login-button">
                Se connecter
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <a href="index.html" class="back-link">
            Retour à l'accueil
        </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // CONFIGURATION SUPABASE À COMPLÉTER
        const SUPABASE_URL = "https://ndnadcyrqtlesyybzgoa.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable__cg6_S1uHx6kXhwkBY2kTg_ZgcIsPAA";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("login-form");
        const button = document.getElementById("login-button");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            button.disabled = true;
            button.textContent = "Connexion en cours...";
            message.textContent = "";

            try {
                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    throw error;
                }

                message.textContent =
                    "Connexion réussie. Vérification des autorisations nécessaire.";

                // Nous ajouterons la redirection vers le tableau de bord
                // après avoir configuré les autorisations administrateur.

            } catch (error) {
                message.textContent =
                    "Échec de connexion : vérifiez vos identifiants " +
                    "et la confirmation de votre adresse e-mail.";
            } finally {
                button.disabled = false;
                button.textContent = "Se connecter";
            }
        });
    </script>

</body>
</html>
