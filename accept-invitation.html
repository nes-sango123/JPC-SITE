<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Accepter l'invitation | JPC</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #14532d;
      font-size: 24px;
    }

    p {
      color: #475569;
      line-height: 1.5;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #14532d;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Bienvenue dans JPC</h1>

    <p>
      Votre invitation a été prise en compte.
      Définissez maintenant votre mot de passe personnel.
    </p>

    <form id="password-form">

      <label for="password">Nouveau mot de passe</label>
      <input
        type="password"
        id="password"
        minlength="8"
        required
        placeholder="Minimum 8 caractères"
      >

      <label for="confirm-password">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirm-password"
        minlength="8"
        required
        placeholder="Répétez votre mot de passe"
      >

      <button type="submit" id="submit-button">
        Continuer
      </button>

    </form>

    <p id="message"></p>

  </div>

  <script>
    const SUPABASE_URL =
      "https://ndnadcyrqtlesyybzgoa.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__cg6_S1uHx6kXhwkBY2kTg_ZgcIsPAA";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("password-form");
    const message = document.getElementById("message");
    const button = document.getElementById("submit-button");

    async function checkInvitation() {
      const hashParams = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const errorDescription = hashParams.get("error_description");

      if (errorDescription) {
        message.textContent = decodeURIComponent(
          errorDescription.replace(/\+/g, " ")
        );
        form.style.display = "none";
        return;
      }

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Invitation invalide ou expirée. Contactez l'administrateur principal.";

        form.style.display = "none";
        return;
      }

      message.textContent =
        "Invitation vérifiée. Vous pouvez définir votre mot de passe.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmation =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        message.textContent =
          "Le mot de passe doit contenir au moins 8 caractères.";
        return;
      }

      if (password !== confirmation) {
        message.textContent =
          "Les deux mots de passe ne correspondent pas.";
        return;
      }

      button.disabled = true;
      button.textContent = "Enregistrement...";

      const { data, error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if (error) {
        message.textContent =
          "Erreur : " + error.message;

        button.disabled = false;
        button.textContent = "Continuer";
        return;
      }

      message.textContent =
        "Mot de passe enregistré. Préparation de votre dossier...";

      window.location.href =
        "complete-profile.html";
    });

    checkInvitation();
  </script>

</body>
</html>
