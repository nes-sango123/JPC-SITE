<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Réinitialisation du mot de passe | JPC-SITE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #14532d;
            text-align: center;
            margin-bottom: 12px;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #14532d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Nouveau mot de passe</h1>

        <p>
            Définissez un nouveau mot de passe pour
            retrouver l'accès à votre espace administrateur.
        </p>

        <form id="passwordForm">

            <label for="newPassword">Nouveau mot de passe</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Entrez votre nouveau mot de passe"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirmer le mot de passe</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirmez votre mot de passe"
                minlength="8"
                required
            >

            <button type="submit" id="submitButton">
                Modifier mon mot de passe
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script>
        const SUPABASE_URL =
            "https://ndnadcyrqtlesyybzgoa.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable__cg6_S1uHx6kXhwkBY2kTg_ZgcIsPAA";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        let recoverySession = false;

        async function checkRecoverySession() {

            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error || !data.session) {
                message.textContent =
                    "Lien de récupération invalide ou expiré. Veuillez demander un nouveau lien.";

                form.style.display = "none";
                return;
            }

            recoverySession = true;

            message.textContent =
                "Vous pouvez maintenant définir votre nouveau mot de passe.";
        }

        supabaseClient.auth.onAuthStateChange((event, session) => {

            if (event === "PASSWORD_RECOVERY" && session) {
                recoverySession = true;
                form.style.display = "block";

                message.textContent =
                    "Lien vérifié. Vous pouvez modifier votre mot de passe.";
            }

        });

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword.length < 8) {
                message.textContent =
                    "Le mot de passe doit contenir au moins 8 caractères.";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent =
                    "Les deux mots de passe ne correspondent pas.";
                return;
            }

            if (!recoverySession) {
                message.textContent =
                    "Votre session de récupération est invalide.";
                return;
            }

            button.disabled = true;
            message.textContent = "Modification en cours...";

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                message.textContent =
                    "Erreur : " + error.message;

                button.disabled = false;
                return;
            }

            message.textContent =
                "Mot de passe modifié avec succès. Redirection...";

            setTimeout(() => {
                window.location.href = "admin.html";
            }, 2500);

        });

        checkRecoverySession();
    </script>

</body>
</html>
